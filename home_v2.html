  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

y:flex;align-items:center;gap:28px;font-size:14px;flex-wrap:wrap;justify-content:flex-end\">\n      <a href=\"#how\" style=\"color:#55565c\" style-hover=\"color:#16171a\">How it works<\u002Fa>\n      <a href=\"#why\" style=\"color:#55565c\" style-hover=\"color:#16171a\">Why Prizm<\u002Fa>\n      <a href=\"#demo\" style=\"padding:9px 16px;background:#16171a;color:#fff\" style-hover=\"background:#c94a0a;color:#fff\">Book a demo<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"top\" data-screen-label=\"Hero\" style=\"padding:clamp(56px,8vw,112px) clamp(20px,4vw,56px) clamp(56px,7vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(48px,6vw,88px);align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:28px;max-width:600px\">\n      <div style=\"display:flex;align-items:center;gap:12px;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#55565c\">\n        <span style=\"width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid #ef6a1f\"><\u002Fspan>\n        Quoting software for door dealers\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font-weight:500;font-size:clamp(42px,5.6vw,76px);line-height:1;letter-spacing:-.035em;text-wrap:balance\">One job in.<br><span style=\"color:#ef6a1f\">Every bid out.<\u002Fspan><\u002Fh1>\n      <p style=\"margin:0;max-width:520px;font-size:clamp(16px,1.3vw,19px);line-height:1.55;color:#4a4b50;text-wrap:pretty\">Prizm prices a job across manufacturers and suppliers in one place, shows the homeowner good-better-best options on your phone, and turns their pick into a QuickBooks estimate with a PO ready to send.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <a href=\"#demo\" style=\"display:inline-flex;align-items:center;gap:10px;padding:15px 22px;background:#c94a0a;color:#fff;font-weight:500;font-size:15px\" style-hover=\"background:#a93d07;color:#fff\">Book a demo <span style=\"font-family:'Geist Mono',monospace\">→<\u002Fspan><\u002Fa>\n        <a href=\"#demo\" style=\"display:inline-flex;align-items:center;padding:15px 22px;border:1px solid #16171a;font-size:15px;color:#16171a\" style-hover=\"background:#16171a;color:#fff\">Get early access<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- HERO IMAGE -->\n    <div style=\"position:relative;width:100%;max-width:560px;justify-self:center;aspect-ratio:4/5\">\n      <img src=\"e248298a-106c-4250-b6dd-0be77493f1c0\" alt=\"Technician on site\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block\">\n      <span style=\"position:absolute;right:-1px;bottom:-1px;width:0;height:0;border-left:44px solid transparent;border-bottom:44px solid #ef6a1f;pointer-events:none\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- BRANDS STRIP -->\n  <section style=\"border-top:1px solid #e6e3de;border-bottom:1px solid #e6e3de;padding:24px clamp(20px,4vw,56px);display:flex;align-items:center;gap:clamp(20px,4vw,56px);flex-wrap:wrap;background:#fff\">\n    <span style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a8b90\">One place to price<\u002Fspan>\n    <div style=\"display:flex;gap:clamp(20px,4vw,52px);flex-wrap:wrap;font-size:20px;font-weight:500;letter-spacing:-.01em;color:#2a2b2f\">\n      <span>Clopay<\u002Fspan><span>Amarr<\u002Fspan><span>OHD<\u002Fspan><span style=\"color:#8a8b90\">+ your parts suppliers<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HOW IT WORKS -->\n  <section id=\"how\" data-screen-label=\"How it works\" style=\"padding:clamp(80px,10vw,128px) clamp(20px,4vw,56px);display:flex;flex-direction:column;gap:56px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-weight:500;font-size:clamp(32px,4vw,54px);line-height:1.04;letter-spacing:-.03em;max-width:720px;text-wrap:balance\">From price sheet to purchase order in three steps.<\u002Fh2>\n      <p style=\"margin:0;max-width:380px;font-size:16px;line-height:1.55;color:#55565c\">One job, priced once, presented once, entered once.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1px;background:#e0ddd7;border:1px solid #e0ddd7\">\n      <div style=\"background:#fff;padding:32px;display:flex;flex-direction:column;gap:28px\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#c94a0a\">01<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:#ef6a1f\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <h3 style=\"margin:0;font-size:22px;font-weight:500;letter-spacing:-.02em\">Price across brands<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#55565c;text-wrap:pretty\">Build the job once. Prizm pulls current pricing from every manufacturer and supplier you carry, side by side.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;border:1px solid #e6e3de;font-size:13px\">\n          <div style=\"padding:11px 14px;border-bottom:1px solid #e6e3de;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a8b90\">16×7 · insulated steel · opener<\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #eeebe6\"><span>Clopay<\u002Fspan><span style=\"font-family:'Geist Mono',monospace\">$1,284<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #eeebe6;background:#fdf1e9\"><span>Amarr<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;color:#c94a0a\">$1,241<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:11px 14px\"><span>OHD · parts &amp; opener<\u002Fspan><span style=\"font-family:'Geist Mono',monospace\">$318<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;padding:32px;display:flex;flex-direction:column;gap:28px\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#c94a0a\">02<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:#ef6a1f\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <h3 style=\"margin:0;font-size:22px;font-weight:500;letter-spacing:-.02em\">Show good-better-best<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#55565c;text-wrap:pretty\">Hand the homeowner your phone. Three clean, professional options, priced and ready to pick.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n          <div style=\"border:1px solid #e6e3de;padding:14px 12px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;color:#8a8b90\">GOOD<\u002Fspan>\n            <span style=\"font-size:18px;font-weight:500\">$1,890<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1.5px solid #ef6a1f;background:#fdf1e9;padding:14px 12px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;color:#c94a0a\">BETTER ✓<\u002Fspan>\n            <span style=\"font-size:18px;font-weight:500\">$2,460<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #e6e3de;padding:14px 12px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;color:#8a8b90\">BEST<\u002Fspan>\n            <span style=\"font-size:18px;font-weight:500\">$3,120<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;padding:32px;display:flex;flex-direction:column;gap:28px\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#1f5bd8\">03<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:#1f5bd8\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <h3 style=\"margin:0;font-size:22px;font-weight:500;letter-spacing:-.02em\">Send to QuickBooks with a PO<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#55565c;text-wrap:pretty\">Their pick becomes a QuickBooks estimate, with the purchase order built and ready for your supplier.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border:1px solid #e6e3de\">\n            <span>QuickBooks estimate <span style=\"font-family:'Geist Mono',monospace;color:#8a8b90\">EST-1042<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#1f5bd8\">CREATED<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border:1.5px solid #1f5bd8;background:#eef3fd\">\n            <span>Supplier PO <span style=\"font-family:'Geist Mono',monospace;color:#8a8b90\">PO-1042<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#1f5bd8\">READY TO SEND →<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- BENEFITS -->\n  <section id=\"why\" data-screen-label=\"Benefits\" style=\"padding:0 clamp(20px,4vw,56px) clamp(80px,10vw,128px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:48px 40px;align-items:start\">\n    <h2 style=\"margin:0;font-weight:500;font-size:clamp(32px,4vw,54px);line-height:1.04;letter-spacing:-.03em;text-wrap:balance;grid-column:1/-1;max-width:760px\">Faster quotes. More yeses. No double entry.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid #16171a\">\n      <span style=\"width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #ef6a1f\"><\u002Fspan>\n      <h3 style=\"margin:0;font-size:19px;font-weight:500;letter-spacing:-.015em\">Every brand in seconds<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:#55565c;text-wrap:pretty\">Stop flipping between price sheets. One job, every manufacturer and supplier, compared while you're still in the driveway.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid #16171a\">\n      <span style=\"width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #ef6a1f\"><\u002Fspan>\n      <h3 style=\"margin:0;font-size:19px;font-weight:500;letter-spacing:-.015em\">Options that close<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:#55565c;text-wrap:pretty\">Tiered choices make it easy for homeowners to say yes, and easy for you to sell up without pushing.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid #16171a\">\n      <span style=\"width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #1f5bd8\"><\u002Fspan>\n      <h3 style=\"margin:0;font-size:19px;font-weight:500;letter-spacing:-.015em\">Enter it once<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:#55565c;text-wrap:pretty\">The approved option goes straight to QuickBooks and the supplier PO. No retyping at the kitchen table at night.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid #16171a\">\n      <span style=\"width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #1f5bd8\"><\u002Fspan>\n      <h3 style=\"margin:0;font-size:19px;font-weight:500;letter-spacing:-.015em\">Built for the truck<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:#55565c;text-wrap:pretty\">Quote from the job site on the phone you already carry, between calls and referrals.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PARTNERS / EXPANSION -->\n  <section data-screen-label=\"Partners\" style=\"padding:0 clamp(20px,4vw,56px) clamp(80px,10vw,128px)\">\n    <div style=\"border:1px solid #d6e0f5;background:#eef3fd;padding:clamp(32px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:48px\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1f5bd8\">Dealers and manufacturers<\u002Fspan>\n        <h2 style=\"margin:0;font-weight:500;font-size:clamp(28px,3.2vw,42px);line-height:1.08;letter-spacing:-.025em;text-wrap:balance\">Good for the dealer. Good for the brands they sell.<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#3f4652;max-width:480px;text-wrap:pretty\">Prizm puts every manufacturer's products in front of homeowners accurately and professionally, then sends clean, correct orders. Faster quotes mean more product sold, for everyone in the chain.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;align-self:end\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#55565c\">Where Prizm quotes<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid #c5d3ef\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #c5d3ef;font-size:18px\"><span>Garage doors<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;padding:4px 8px;background:#ef6a1f;color:#16171a\">LIVE<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #c5d3ef;font-size:18px;color:#3f4652\"><span>Entry doors<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;color:#1f5bd8\">NEXT<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #c5d3ef;font-size:18px;color:#3f4652\"><span>Windows<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;color:#1f5bd8\">NEXT<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #c5d3ef;font-size:18px;color:#3f4652\"><span>Gates<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;color:#1f5bd8\">NEXT<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FINAL CTA -->\n  <section id=\"demo\" data-screen-label=\"CTA\" style=\"padding:clamp(80px,10vw,128px) clamp(20px,4vw,56px);border-top:1px solid #e6e3de;background:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px\">\n    <svg width=\"56\" height=\"44\" sc-camel-view-box=\"0 0 28 22\" style=\"display:block\"><polygon points=\"10,3 18,0.5 26.5,18 18,21\" fill=\"#1f5bd8\"><\u002Fpolygon><polygon points=\"1.5,21 10,3 18,21\" fill=\"#ef6a1f\"><\u002Fpolygon><\u002Fsvg>\n    <h2 style=\"margin:0;font-weight:500;font-size:clamp(38px,5vw,68px);line-height:1.02;letter-spacing:-.035em;max-width:900px;text-wrap:balance\">Quote your next job in Prizm.<\u002Fh2>\n    <p style=\"margin:0;max-width:520px;font-size:17px;line-height:1.55;color:#55565c\">Book a 20-minute demo with your own price sheets, or join early access and we'll set you up.<\u002Fp>\n    <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex;width:100%;max-width:520px;border:1px solid #16171a;background:#fff;flex-wrap:wrap\">\n        <input type=\"email\" required=\"required\" placeholder=\"you@yourdealership.com\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"flex:1 1 220px;min-width:0;padding:17px 18px;background:transparent;border:0;outline:none;color:#16171a;font:inherit;font-size:15px\">\n        <button type=\"submit\" style=\"flex:0 0 auto;padding:17px 22px;border:0;background:#c94a0a;color:#fff;font:inherit;font-size:15px;font-weight:500;cursor:pointer\" style-hover=\"background:#a93d07\">Book a demo →<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:17px 22px;border:1.5px solid #1f5bd8;background:#eef3fd;font-size:15px\">Thanks. We'll reach out to {{ email }} within one business day.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"border-top:1px solid #e6e3de;padding:28px clamp(20px,4vw,56px);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:#8a8b90\">\n    <span style=\"display:flex;align-items:center;gap:8px;color:#16171a;letter-spacing:.18em;font-weight:600\">\n      <svg width=\"20\" height=\"16\" sc-camel-view-box=\"0 0 28 22\" style=\"display:block\"><polygon points=\"10,3 18,0.5 26.5,18 18,21\" fill=\"#1f5bd8\"><\u002Fpolygon><polygon points=\"1.5,21 10,3 18,21\" fill=\"#ef6a1f\"><\u002Fpolygon><\u002Fsvg>PRIZM\n    <\u002Fspan>\n    <span>© 2026 Prizm. Quoting software for dealers.<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { email: '', submitted: false };\n  renderVals() {\n    return {\n      email: this.state.email,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      onEmail: (e) => this.setState({ email: e.target.value }),\n      onSubmit: (e) => { e.preventDefault(); this.setState({ submitted: true }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
