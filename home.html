document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

style=\"margin:0;font-size:20px;font-weight:500;letter-spacing:-.015em\">Built for the truck<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:rgba(243,243,241,.62);text-wrap:pretty\">Quote from the job site on the phone you already carry, between calls and referrals.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PARTNERS / EXPANSION -->\n  <section data-screen-label=\"Partners\" style=\"padding:0 clamp(20px,4vw,56px) clamp(80px,10vw,140px)\">\n    <div style=\"position:relative;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.01));backdrop-filter:blur(20px);padding:clamp(32px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:48px;overflow:hidden\">\n      <div style=\"position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(255,59,92,0),#ff3b5c,#ffe14d,#3ddc84,#2ec5ff,#b44dff,rgba(180,77,255,0))\"><\u002Fdiv>\n      <div style=\"position:absolute;right:-120px;top:-160px;width:420px;height:420px;background:conic-gradient(from 200deg,#ff3b5c,#ff9f1c,#ffe14d,#3ddc84,#2ec5ff,#5b6cff,#b44dff,#ff3b5c);filter:blur(90px);opacity:.22;pointer-events:none\"><\u002Fdiv>\n      <div style=\"position:relative;display:flex;flex-direction:column;gap:18px\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,243,241,.55)\">Dealers and manufacturers<\u002Fspan>\n        <h2 style=\"margin:0;font-weight:500;font-size:clamp(28px,3.2vw,44px);line-height:1.06;letter-spacing:-.025em;text-wrap:balance\">Good for the dealer. Good for the brands they sell.<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:rgba(243,243,241,.68);max-width:480px;text-wrap:pretty\">Prizm puts every manufacturer's products in front of homeowners accurately and professionally, then sends clean, correct orders. Faster quotes mean more product sold, for everyone in the chain.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;display:flex;flex-direction:column;gap:14px;align-self:end\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,243,241,.55)\">Where Prizm quotes<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.12)\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:18px\"><span>Garage doors<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;color:#3ddc84\">LIVE<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:18px;color:rgba(243,243,241,.7)\"><span>Entry doors<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;color:rgba(243,243,241,.45)\">NEXT<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:18px;color:rgba(243,243,241,.7)\"><span>Windows<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;color:rgba(243,243,241,.45)\">NEXT<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:18px;color:rgba(243,243,241,.7)\"><span>Gates<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;color:rgba(243,243,241,.45)\">NEXT<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FINAL CTA -->\n  <section id=\"demo\" data-screen-label=\"CTA\" style=\"position:relative;padding:clamp(80px,10vw,140px) clamp(20px,4vw,56px);border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;overflow:hidden\">\n    <div style=\"position:absolute;left:50%;bottom:-260px;width:900px;height:420px;transform:translateX(-50%);background:linear-gradient(90deg,#ff3b5c,#ff9f1c,#ffe14d,#3ddc84,#2ec5ff,#5b6cff,#b44dff);filter:blur(120px);opacity:.28;pointer-events:none\"><\u002Fdiv>\n    <svg width=\"64\" height=\"50\" sc-camel-view-box=\"0 0 28 22\" style=\"position:relative;display:block\"><defs><linearGradient id=\"pzB\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ff3b5c\"><\u002Fstop><stop offset=\".35\" stop-color=\"#ffe14d\"><\u002Fstop><stop offset=\".65\" stop-color=\"#2ec5ff\"><\u002Fstop><stop offset=\"1\" stop-color=\"#b44dff\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs><polygon points=\"10,3 18,0.5 26.5,18 18,21\" fill=\"url(#pzB)\"><\u002Fpolygon><polygon points=\"1.5,21 10,3 18,21\" fill=\"#f3f3f1\"><\u002Fpolygon><polygon points=\"10,3 18,0.5 18,21\" fill=\"#070708\" opacity=\".35\"><\u002Fpolygon><\u002Fsvg>\n    <h2 style=\"position:relative;margin:0;font-weight:500;font-size:clamp(40px,5.6vw,80px);line-height:1;letter-spacing:-.035em;max-width:900px;text-wrap:balance\">Quote your next job in Prizm.<\u002Fh2>\n    <p style=\"position:relative;margin:0;max-width:520px;font-size:17px;line-height:1.55;color:rgba(243,243,241,.68)\">Book a 20-minute demo with your own price sheets, or join early access and we'll set you up.<\u002Fp>\n    <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"position:relative;display:flex;gap:0;width:100%;max-width:520px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);backdrop-filter:blur(16px);flex-wrap:wrap\">\n        <input type=\"email\" required=\"required\" placeholder=\"you@yourdealership.com\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"flex:1 1 220px;min-width:0;padding:17px 18px;background:transparent;border:0;outline:none;color:#f3f3f1;font:inherit;font-size:15px\">\n        <button type=\"submit\" style=\"flex:0 0 auto;padding:17px 22px;border:0;background:#f3f3f1;color:#070708;font:inherit;font-size:15px;font-weight:500;cursor:pointer\" style-hover=\"background:#fff\">Book a demo →<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:relative;padding:17px 22px;border:1px solid #3ddc84;background:rgba(61,220,132,.08);font-size:15px\">Thanks. We'll reach out to {{ email }} within one business day.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"border-top:1px solid rgba(255,255,255,.08);padding:28px clamp(20px,4vw,56px);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:rgba(243,243,241,.5)\">\n    <span style=\"display:flex;align-items:center;gap:8px;color:#f3f3f1;letter-spacing:.18em;font-weight:600\">\n      <svg width=\"20\" height=\"16\" sc-camel-view-box=\"0 0 28 22\" style=\"display:block\"><defs><linearGradient id=\"pzC\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ff3b5c\"><\u002Fstop><stop offset=\".35\" stop-color=\"#ffe14d\"><\u002Fstop><stop offset=\".65\" stop-color=\"#2ec5ff\"><\u002Fstop><stop offset=\"1\" stop-color=\"#b44dff\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs><polygon points=\"10,3 18,0.5 26.5,18 18,21\" fill=\"url(#pzC)\"><\u002Fpolygon><polygon points=\"1.5,21 10,3 18,21\" fill=\"#f3f3f1\"><\u002Fpolygon><polygon points=\"10,3 18,0.5 18,21\" fill=\"#070708\" opacity=\".35\"><\u002Fpolygon><\u002Fsvg>PRIZM\n    <\u002Fspan>\n    <span>© 2026 Prizm. Quoting software for dealers.<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prism&quot;},&quot;showBeams&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prism&quot;}}\">\nclass Component extends DCLogic {\n  state = { email: '', submitted: false };\n  heroRef = React.createRef();\n\n  async componentDidMount() {\n    const THREE = await import((window.__resources && window.__resources.three) || 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');\n    const el = this.heroRef.current;\n    if (!el || this._dead) return;\n    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n    renderer.toneMapping = THREE.ACESFilmicToneMapping;\n    renderer.toneMappingExposure = 1.1;\n    renderer.domElement.style.cssText = 'display:block;width:100%;height:100%';\n    el.appendChild(renderer.domElement);\n\n    const scene = new THREE.Scene();\n    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);\n\n    // environment: black room lit by spectrum strips + a white softbox\n    const env = new THREE.Scene();\n    env.background = new THREE.Color(0x020203);\n    const spec = [0xff3b5c, 0xff9f1c, 0xffe14d, 0x3ddc84, 0x2ec5ff, 0x5b6cff, 0xb44dff];\n    spec.forEach((c, i) => {\n      const m = new THREE.Mesh(new THREE.BoxGeometry(0.6, 10, 0.6), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(3) }));\n      const a = (i / spec.length) * Math.PI * 2;\n      m.position.set(Math.cos(a) * 6, 0, Math.sin(a) * 6);\n      env.add(m);\n    });\n    const sb = new THREE.Mesh(new THREE.PlaneGeometry(8, 1.2), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffffff).multiplyScalar(4), side: THREE.DoubleSide }));\n    sb.position.set(0, 6, 0); sb.rotation.x = Math.PI / 2; env.add(sb);\n    const sb2 = sb.clone(); sb2.position.set(-6, 1, 3); sb2.rotation.set(0, Math.PI / 2, 0); env.add(sb2);\n    const pmrem = new THREE.PMREMGenerator(renderer);\n    scene.environment = pmrem.fromScene(env, 0.03).texture;\n\n    const group = new THREE.Group();\n    scene.add(group);\n\n    // prism: triangular, apex up, facing camera\n    const geo = new THREE.CylinderGeometry(1.5, 1.5, 3.2, 3, 1);\n    const mat = new THREE.MeshPhysicalMaterial({\n      color: 0x8a90a0, metalness: 0, roughness: 0.07, transmission: 1, thickness: 3, ior: 1.6,\n      dispersion: 6, iridescence: 0.9, iridescenceIOR: 1.35, clearcoat: 1, clearcoatRoughness: 0.02,\n      envMapIntensity: 1.8, specularIntensity: 1, attenuationColor: new THREE.Color(0x9aa4c0), attenuationDistance: 1.5\n    });\n    const prism = new THREE.Mesh(geo, mat);\n    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }));\n    const prismWrap = new THREE.Group();\n    prismWrap.add(prism, edges);\n    prismWrap.rotation.x = -Math.PI / 2;\n    const pivot = new THREE.Group();\n    pivot.add(prismWrap);\n    group.add(pivot);\n\n    // beams (additive, vertex-colored quads)\n    const beams = new THREE.Group();\n    pivot.add(beams);\n    // dim spectrum bars behind the prism so transmission has color to refract\n    const back = new THREE.Group();\n    spec.forEach((hex, i) => {\n      const bar = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.8), new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(0.12) }));\n      bar.position.set(-0.45 + i * 0.15, 0.1, -0.8);\n      bar.rotation.z = 0.18;\n      back.add(bar);\n    });\n    back.visible = false;\n    pivot.add(back);\n    const bmat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });\n    const quad = (p0a, p0b, p1a, p1b, c0, c1, z = 0) => {\n      const g = new THREE.BufferGeometry();\n      g.setAttribute('position', new THREE.Float32BufferAttribute([...p0a, z, ...p0b, z, ...p1a, z, ...p1b, z], 3));\n      g.setAttribute('color', new THREE.Float32BufferAttribute([...c0, ...c0, ...c1, ...c1], 3));\n      g.setIndex([0, 1, 2, 1, 3, 2]);\n      return new THREE.Mesh(g, bmat);\n    };\n    const inP = [-0.69, 0.3], outP = [0.75, 0.2];\n    beams.add(quad([-12, -2.35], [-12, -2.25], [inP[0], inP[1] - 0.035], [inP[0], inP[1] + 0.035], [0.25, 0.25, 0.25], [1, 1, 1]));\n    beams.add(quad([-12, -2.5], [-12, -2.1], [inP[0], inP[1] - 0.08], [inP[0], inP[1] + 0.08], [0.03, 0.03, 0.03], [0.1, 0.1, 0.1]));\n    beams.add(quad([inP[0], inP[1] - 0.04], [inP[0], inP[1] + 0.04], [outP[0], outP[1] - 0.12], [outP[0], outP[1] + 0.12], [0.5, 0.5, 0.5], [0.45, 0.4, 0.5]));\n    const n = spec.length, top = -0.4, bot = -4.2, endX = 12, bw = (top - bot) / n;\n    spec.forEach((hex, i) => {\n      const c = new THREE.Color(hex);\n      const s0 = outP[1] + 0.12 - (i / n) * 0.24, s1 = outP[1] + 0.12 - ((i + 1) / n) * 0.24;\n      const e0 = top - i * bw, e1 = top - (i + 1) * bw;\n      beams.add(quad([outP[0], s1], [outP[0], s0], [endX, e1], [endX, e0], [c.r, c.g, c.b], [c.r * 0.25, c.g * 0.25, c.b * 0.25]));\n      beams.add(quad([outP[0], s1 - 0.05], [outP[0], s0 + 0.05], [endX, e1 - 0.35], [endX, e0 + 0.35], [c.r * 0.12, c.g * 0.12, c.b * 0.12], [c.r * 0.04, c.g * 0.04, c.b * 0.04], -0.2));\n    });\n\n    // floor reflection hint\n    const glow = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshBasicMaterial({ color: 0x222233, transparent: true, opacity: 0.0 }));\n    group.add(glow);\n\n    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };\n    const onMove = (e) => { mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2; mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2; };\n    window.addEventListener('pointermove', onMove);\n\n    const resize = () => {\n      const w = el.clientWidth, h = el.clientHeight;\n      if (!w || !h) return;\n      renderer.setSize(w, h, false);\n      const a = w / h;\n      camera.aspect = a;\n      camera.position.set(0, 0, a < 1 ? 16 / a * 0.75 : 14);\n      camera.updateProjectionMatrix();\n      if (a > 1.15) { group.position.set(a > 1.6 ? 2.6 : 2.0, 0.9, 0); group.scale.setScalar(1); }\n      else { group.position.set(0.4, 3.2, 0); group.scale.setScalar(0.85); }\n    };\n    const ro = new ResizeObserver(resize); ro.observe(el); resize();\n\n    const clock = new THREE.Clock();\n    const loop = () => {\n      if (this._dead) return;\n      this._raf = requestAnimationFrame(loop);\n      const t = clock.getElapsedTime();\n      mouse.x += (mouse.tx - mouse.x) * 0.04; mouse.y += (mouse.ty - mouse.y) * 0.04;\n      const spin = this.props.autoRotate ?? true;\n      pivot.rotation.y = 0.15 + (spin ? Math.sin(t * 0.35) * 0.1 : 0) + mouse.x * 0.08;\n      pivot.rotation.x = (spin ? Math.sin(t * 0.27) * 0.03 : 0) + mouse.y * 0.04;\n      pivot.rotation.z = Math.sin(t * 0.2) * 0.03;\n      beams.visible = this.props.showBeams ?? true;\n      bmat.opacity = 0.85 + Math.sin(t * 1.3) * 0.15;\n      renderer.render(scene, camera);\n    };\n    loop();\n\n    this._cleanup = () => {\n      cancelAnimationFrame(this._raf); ro.disconnect();\n      window.removeEventListener('pointermove', onMove);\n      renderer.dispose(); pmrem.dispose();\n      renderer.domElement.remove();\n    };\n  }\n\n  componentWillUnmount() { this._dead = true; this._cleanup && this._cleanup(); }\n\n  renderVals() {\n    return {\n      heroRef: this.heroRef,\n      email: this.state.email,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      onEmail: (e) => this.setState({ email: e.target.value }),\n      onSubmit: (e) => { e.preventDefault(); this.setState({ submitted: true }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
